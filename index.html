<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Deal or No Deal - Vehicle Edition</title>
  </head>
  <body>
    <div class="game-container">
      <h1>Deal or No Deal - Vehicle Edition</h1>
      <div class="probability-box">
        <h3>Winning Probability Calculator</h3>
        <div class="probability-details" id="probabilityDetails">
          Loading probability...
        </div>
      </div>
      <div class="game-status" id="gameStatus">
        Select your briefcase to start!
      </div>
      <div class="briefcases" id="briefcases"></div>
      <div class="banker-offer" id="bankerOffer">
        <h2>Banker's Offer</h2>
        <p id="offerText"></p>
        <button onclick="acceptDeal()">Deal</button>
        <button onclick="rejectDeal()">No Deal</button>
      </div>
      <div class="prizes" id="prizes"></div>
      <div class="game-controls">
        <button onclick="restartGame()">New Game</button>
      </div>
    </div>
  </body>
</html>
